services:
  - type: web
    name: cat-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false   # This tells Render to ask for it in dashboard
      - key: BOT_PREFIX
        value: "."
      - key: MAX_WORKERS
        value: "8"
      - key: FETCH_TIMEOUT
        value: "15"
